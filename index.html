<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dreamstinct — Apps that matter</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #EAEAEA;
      color: #2D2D2D;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 48px 24px;
    }

    .card {
      background: #F9F7F2;
      border-radius: 24px;
      padding: 64px 48px;
      max-width: 480px;
      width: 100%;
      text-align: center;
      border: 1px solid rgba(0,0,0,0.07);
    }

    h1 { font-size: 28px; font-weight: 700; margin-bottom: 8px; }
    p { font-size: 16px; color: #888; line-height: 1.6; margin-bottom: 32px; }

    .app-link {
      display: block;
      background: #EAEAEA;
      border-radius: 14px;
      padding: 20px 24px;
      text-decoration: none;
      color: #2D2D2D;
      text-align: left;
      border: 1px solid rgba(0,0,0,0.07);
      transition: background 0.2s;
    }

    .app-link:hover { background: #E0DED9; }

    .app-name { font-weight: 700; font-size: 16px; }
    .app-desc { font-size: 13px; color: #888; margin-top: 4px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Dreamstinct</h1>
    <p>Apps built with intention.</p>
    <a class="app-link" href="/bankoftodays/">
      <div class="app-name">Bank of Todays</div>
      <div class="app-desc">Your daily life journal</div>
    </a>
  </div>
</body>
</html>
